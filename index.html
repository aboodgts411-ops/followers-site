<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Followers Boost Pro</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.container{
  max-width:420px;
  margin:auto;
  padding:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
}

.hidden{display:none;}

input, button{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
  border:none;
  cursor:pointer;
}

.account{
  background:#020617;
  padding:10px;
  border-radius:10px;
  margin:5px 0;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>🚀 Followers Boost Pro</h1>

<div id="auth">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="register()">تسجيل</button>
<button onclick="login()">دخول</button>
</div>

<div id="app" class="hidden">

<h3>⭐ النقاط: <span id="points">0</span></h3>

<button onclick="buyPoints()">💰 شراء 100 نقطة</button>

<input id="link" placeholder="رابط حسابك">
<button onclick="addLink()">إرسال</button>

<h3>👥 الحسابات</h3>
<div id="list"></div>

<h3>🏆 أفضل المستخدمين</h3>
<div id="leaderboard"></div>

<button onclick="logout()">تسجيل الخروج</button>

</div>

</div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC0BzESCHSyXZhOxF8FXxEjxs_WYIPOEhA",
  authDomain: "followers-app-f3419.firebaseapp.com",
  projectId: "followers-app-f3419",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const authDiv = document.getElementById("auth");
const appDiv = document.getElementById("app");
const pointsSpan = document.getElementById("points");
const linkInput = document.getElementById("link");
const listDiv = document.getElementById("list");
const leaderboardDiv = document.getElementById("leaderboard");

let currentUser = null;

// تسجيل
function register(){
  auth.createUserWithEmailAndPassword(emailInput.value,passwordInput.value)
  .then(u=>{
    currentUser=u.user;
    db.collection("users").doc(currentUser.uid).set({points:100});
    alert("تم التسجيل");
  })
  .catch(e=>alert(e.message));
}

// دخول
function login(){
  auth.signInWithEmailAndPassword(emailInput.value,passwordInput.value)
  .then(()=>alert("تم الدخول"))
  .catch(e=>alert(e.message));
}

// مراقبة المستخدم
auth.onAuthStateChanged(user=>{
  if(user){
    currentUser=user;

    authDiv.style.display="none";
    appDiv.classList.remove("hidden");

    db.collection("users").doc(user.uid).get().then(doc=>{
      pointsSpan.innerText=doc.data().points;
    });

    loadAccounts();
    loadLeaderboard();
  }
});

// شراء نقاط
function buyPoints(){
  let ref=db.collection("users").doc(currentUser.uid);

  ref.get().then(doc=>{
    let p=doc.data().points+100;
    ref.update({points:p});
    pointsSpan.innerText=p;
  });
}

// إضافة رابط
function addLink(){
  db.collection("accounts").add({url:linkInput.value});
  loadAccounts();
}

// عرض الحسابات
function loadAccounts(){
  db.collection("accounts").get().then(data=>{
    listDiv.innerHTML="";
    data.forEach(doc=>{
      let url=doc.data().url;

      listDiv.innerHTML+=`
      <div class="account">
        ${url}
        <button onclick="follow('${url}',this)">تابع</button>
      </div>`;
    });
  });
}

// متابعة مع حماية
function follow(url,btn){
  btn.disabled=true;
  btn.innerText="انتظر 10 ثواني...";

  window.open(url,"_blank");

  let t=10;

  let timer=setInterval(()=>{
    t--;
    btn.innerText="انتظر "+t+" ث";

    if(t<=0){
      clearInterval(timer);

      btn.innerText="تم ✔";

      let ref=db.collection("users").doc(currentUser.uid);

      ref.get().then(doc=>{
        let p=doc.data().points+10;
        ref.update({points:p});
        pointsSpan.innerText=p;
      });
    }
  },1000);
}

// Leaderboard
function loadLeaderboard(){
  db.collection("users").orderBy("points","desc").limit(5)
  .onSnapshot(data=>{
    leaderboardDiv.innerHTML="";

    data.forEach(doc=>{
      leaderboardDiv.innerHTML+=`
      <div class="account">
        👤 ${doc.id} - ⭐ ${doc.data().points}
      </div>`;
    });
  });
}

// خروج
function logout(){
  auth.signOut();
  location.reload();
}
</script>

</body>
  </html>

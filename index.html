<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Followers Boost Pro</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

nav{
  background:#020617;
  padding:10px;
}

nav button{
  margin:5px;
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.container{
  max-width:400px;
  margin:auto;
  padding:20px;
}

.hidden{display:none;}

input, button{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
  border:none;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
}
</style>
</head>

<body>

<nav>
<button onclick="showPage('home')">🏠 الرئيسية</button>
<button onclick="showPage('about')">ℹ️ من نحن</button>
<button onclick="showPage('privacy')">🔒 سياسة الخصوصية</button>
</nav>

<div class="container">

<!-- الصفحة الرئيسية -->
<div id="home" class="card">

<h1>🚀 Followers Boost</h1>

<div id="auth">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="register()">تسجيل</button>
<button onclick="login()">دخول</button>
</div>

<div id="app" class="hidden">

<h3>النقاط: <span id="points">0</span></h3>

<input id="link" placeholder="رابط حسابك">
<button onclick="addLink()">إرسال</button>

<div id="list"></div>

<button onclick="logout()">تسجيل الخروج</button>

</div>

</div>

<!-- من نحن -->
<div id="about" class="card hidden">
<h2>من نحن</h2>
<p>
هذا الموقع يهدف إلى مساعدة المستخدمين على زيادة متابعيهم
من خلال تبادل التفاعل بين المستخدمين بطريقة بسيطة وسريعة.
</p>
</div>

<!-- سياسة الخصوصية -->
<div id="privacy" class="card hidden">
<h2>سياسة الخصوصية</h2>
<p>
نحن نحترم خصوصيتك ولا نقوم بمشاركة بياناتك مع أي طرف ثالث.
يتم استخدام البريد الإلكتروني فقط لتسجيل الدخول.
</p>
</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC0BzESCHSyXZhOxF8FXxEjxs_WYIPOEhA",
  authDomain: "followers-app-f3419.firebaseapp.com",
  projectId: "followers-app-f3419",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser=null;

function showPage(page){
  document.querySelectorAll(".card").forEach(el=>el.classList.add("hidden"));
  document.getElementById(page).classList.remove("hidden");
}

function register(){
  auth.createUserWithEmailAndPassword(email.value,password.value)
  .then(u=>{
    currentUser=u.user;
    db.collection("users").doc(currentUser.uid).set({points:100});
  });
}

function login(){
  auth.signInWithEmailAndPassword(email.value,password.value);
}

auth.onAuthStateChanged(user=>{
  if(user){
    currentUser=user;
    auth.style.display="none";
    app.classList.remove("hidden");

    db.collection("users").doc(user.uid).get().then(doc=>{
      points.innerText=doc.data().points;
    });

    load();
  }
});

function addLink(){
  db.collection("accounts").add({url:link.value});
  load();
}

function load(){
  db.collection("accounts").get().then(data=>{
    list.innerHTML="";
    data.forEach(doc=>{
      list.innerHTML+=`<p>${doc.data().url}</p>`;
    });
  });
}

function logout(){
  auth.signOut();
  location.reload();
}
</script>

</body>
</html>

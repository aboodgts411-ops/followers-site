<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Followers Boost Online</title>
</head>

<body style="font-family:Arial; text-align:center; background:#0f172a; color:white; padding:50px;">

<h1>🌐 Followers Boost (Online)</h1>

<input id="link" placeholder="رابط حسابك" style="padding:10px; width:250px;">
<br><br>
<button onclick="addLink()" style="padding:10px;">إرسال</button>

<h3>الحسابات</h3>
<div id="list"></div>

<!-- Firebase compat version -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
// 🔥 كودك تم وضعه هنا جاهز
const firebaseConfig = {
  apiKey: "AIzaSyC0BzESCHSyXZhOxF8FXxEjxs_WYIPOEhA",
  authDomain: "followers-app-f3419.firebaseapp.com",
  projectId: "followers-app-f3419",
  storageBucket: "followers-app-f3419.firebasestorage.app",
  messagingSenderId: "351403636037",
  appId: "1:351403636037:web:e6d1a3122078ec083c3a2c"
};

// تشغيل Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function addLink(){
  let link = document.getElementById("link").value;

  db.collection("accounts").add({
    url: link
  }).then(()=>{
    show();
  });
}

function show(){
  let list = document.getElementById("list");
  list.innerHTML = "";

  db.collection("accounts").get().then((data)=>{
    data.forEach(doc=>{
      list.innerHTML += `<p>${doc.data().url}</p>`;
    });
  });
}

// عرض البيانات عند فتح الموقع
show();
</script>

</body>
</html>

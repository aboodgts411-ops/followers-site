<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Followers Boost Pro</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;}
.container{max-width:420px;margin:auto;padding:20px;}
.card{background:#1e293b;padding:20px;border-radius:20px;}
input,button{width:100%;padding:10px;margin:5px 0;border-radius:10px;border:none;}
button{cursor:pointer;font-weight:bold;}
.account{background:#020617;padding:10px;border-radius:10px;margin:5px 0;}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h2>🚀 Followers Boost</h2>

<div id="auth">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="register()">تسجيل</button>
<button onclick="login()">دخول</button>
</div>

<div id="app" class="hidden">

<p>⭐ نقاطك: <span id="points">0</span></p>

<button onclick="buy()">💳 شراء 100 نقطة</button>

<input id="tx" placeholder="Transaction ID">
<button onclick="verify()">✅ تأكيد الدفع</button>

<input id="link" placeholder="رابط المهمة">
<button onclick="addTask()">➕ إضافة مهمة</button>

<div id="list"></div>

<button onclick="logout()">خروج</button>

</div>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig={
 apiKey:"AIzaSy...",
 authDomain:"followers-app-f3419.firebaseapp.com",
 projectId:"followers-app-f3419"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();

let currentUser=null;

auth.onAuthStateChanged(user=>{
 if(user){
  currentUser=user;

  auth.style.display="none";
  app.classList.remove("hidden");

  db.collection("users").doc(user.uid).get().then(doc=>{
    points.innerText=doc.data().points;
  });

  loadTasks();
 }
});

function register(){
 auth.createUserWithEmailAndPassword(email.value,password.value)
 .then(u=>{
  db.collection("users").doc(u.user.uid).set({points:100});
 });
}

function login(){
 auth.signInWithEmailAndPassword(email.value,password.value);
}

// 💳 شراء
function buy(){
 window.open("https://paypal.me/Lakrad989/1");
}

// ✅ تحقق
function verify(){

 let id=tx.value;

 if(!id){
  alert("أدخل Transaction ID");
  return;
 }

 let ref=db.collection("payments").doc(id);

 ref.get().then(doc=>{

  if(doc.exists){
    alert("تم استخدام هذا الكود ❌");
    return;
  }

  ref.set({
    user:currentUser.uid
  });

  let userRef=db.collection("users").doc(currentUser.uid);

  userRef.get().then(d=>{
    let p=d.data().points+100;
    userRef.update({points:p});
    points.innerText=p;
  });

  alert("تمت العملية بنجاح ✅");
 });
}

// مهام
function addTask(){
 db.collection("tasks").add({url:link.value});
 loadTasks();
}

function loadTasks(){
 db.collection("tasks").get().then(s=>{
  list.innerHTML="";
  s.forEach(d=>{
    let url=d.data().url;

    list.innerHTML+=`
    <div class="account">
    ${url}
    <button onclick="doTask('${url}',this)">تنفيذ</button>
    </div>`;
  });
 });
}

function doTask(url,btn){
 btn.disabled=true;
 window.open(url);

 setTimeout(()=>{
  let ref=db.collection("users").doc(currentUser.uid);

  ref.get().then(d=>{
    let p=d.data().points+10;
    ref.update({points:p});
    points.innerText=p;
  });

  btn.innerText="✔";
 },10000);
}

function logout(){
 auth.signOut();
 location.reload();
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Followers Boost Pro</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  text-align:center;
}

.container{
  max-width:400px;
  margin:auto;
  padding:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:20px;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

input{
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
  border:none;
}

button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  cursor:pointer;
}

.send{background:#38bdf8;}
.follow{background:#22c55e;}
.buy{background:gold; color:black;}
.logout{background:red;}

.account{
  background:#0f172a;
  padding:10px;
  border-radius:10px;
  margin:10px 0;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>🚀 Followers Boost Pro</h1>

<div id="auth">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">تسجيل</button>
<button onclick="login()">دخول</button>
</div>

<div id="app" style="display:none;">

<h3>النقاط: <span id="points">0</span></h3>

<button class="buy" onclick="buyPoints()">💰 شراء نقاط</button>

<input id="link" placeholder="رابط حسابك">
<button class="send" onclick="addLink()">إرسال</button>

<h3>👥 الحسابات</h3>
<div id="list"></div>

<h3>🏆 أفضل المستخدمين</h3>
<div id="leaderboard"></div>

<button class="logout" onclick="logout()">تسجيل الخروج</button>

</div>

</div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
// 🔥 Firebase config (كودك)
const firebaseConfig = {
  apiKey: "AIzaSyC0BzESCHSyXZhOxF8FXxEjxs_WYIPOEhA",
  authDomain: "followers-app-f3419.firebaseapp.com",
  projectId: "followers-app-f3419",
  storageBucket: "followers-app-f3419.firebasestorage.app",
  messagingSenderId: "351403636037",
  appId: "1:351403636037:web:e6d1a3122078ec083c3a2c"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;

// تسجيل
function register(){
  let email = document.getElementById("email").value;
  let pass = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email, pass)
  .then(user=>{
    currentUser = user.user;
    db.collection("users").doc(currentUser.uid).set({
      points:100
    });
  })
  .catch(e=>alert(e.message));
}

// دخول
function login(){
  let email = document.getElementById("email").value;
  let pass = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, pass)
  .catch(e=>alert(e.message));
}

// مراقبة المستخدم
auth.onAuthStateChanged(user=>{
  if(user){
    currentUser = user;

    document.getElementById("auth").style.display="none";
    document.getElementById("app").style.display="block";

    db.collection("users").doc(user.uid).get().then(doc=>{
      document.getElementById("points").innerText = doc.data().points;
    });

    loadAccounts();
    loadLeaderboard();
  }
});

// شراء نقاط
function buyPoints(){
  let ref = db.collection("users").doc(currentUser.uid);

  ref.get().then(doc=>{
    let p = doc.data().points + 100;
    ref.update({points:p});
    document.getElementById("points").innerText = p;
  });
}

// إضافة رابط
function addLink(){
  let link = document.getElementById("link").value;

  let ref = db.collection("users").doc(currentUser.uid);

  ref.get().then(doc=>{
    let p = doc.data().points;

    if(p < 10){
      alert("❌ لا توجد نقاط");
      return;
    }

    db.collection("accounts").add({url:link});

    ref.update({points:p-10});
    document.getElementById("points").innerText = p-10;
  });
}

// عرض الحسابات
function loadAccounts(){
  db.collection("accounts").onSnapshot(data=>{
    let list = document.getElementById("list");
    list.innerHTML="";

    data.forEach(doc=>{
      let acc = doc.data().url;

      list.innerHTML += `
      <div class="account">
        ${acc}
        <button class="follow" onclick="follow('${acc}')">تابع</button>
      </div>`;
    });
  });
}

// متابعة
function follow(link){
  window.open(link,"_blank");

  let ref = db.collection("users").doc(currentUser.uid);

  ref.get().then(doc=>{
    let p = doc.data().points + 10;
    ref.update({points:p});
    document.getElementById("points").innerText = p;
  });
}

// Leaderboard
function loadLeaderboard(){
  db.collection("users").orderBy("points","desc").limit(5)
  .onSnapshot(data=>{
    let board = document.getElementById("leaderboard");
    board.innerHTML="";

    data.forEach(doc=>{
      board.innerHTML += `
      <p style="background:#111; padding:10px; border-radius:10px;">
      👤 ${doc.id} — ⭐ ${doc.data().points}
      </p>`;
    });
  });
}

// خروج
function logout(){
  auth.signOut();
  location.reload();
}
</script>

</body>
</html>

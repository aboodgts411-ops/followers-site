<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Followers Boost Pro</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

nav{
  background:#020617;
  padding:10px;
  text-align:center;
}

nav button{
  margin:5px;
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.container{
  max-width:420px;
  margin:auto;
  padding:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
}

.hidden{display:none;}

input, button{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
  border:none;
}

.account{
  background:#020617;
  padding:10px;
  border-radius:10px;
  margin:5px 0;
}
</style>
</head>

<body>

<nav>
<button onclick="showPage('home')">🏠 الرئيسية</button>
<button onclick="showPage('about')">ℹ️ من نحن</button>
<button onclick="showPage('privacy')">🔒 سياسة الخصوصية</button>
</nav>

<div class="container">

<!-- الرئيسية -->
<div id="home" class="card">

<h1>🚀 Followers Boost</h1>

<!-- إعلان علوي -->
<div>
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-XXXXXXX"
       data-ad-slot="111111"
       data-ad-format="auto"></ins>
</div>

<div id="auth">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="register()">تسجيل</button>
<button onclick="login()">دخول</button>
</div>

<div id="app" class="hidden">

<h3>⭐ النقاط: <span id="points">0</span></h3>

<input id="link" placeholder="رابط حسابك">
<button onclick="addLink()">إرسال</button>

<h3>👥 الحسابات</h3>
<div id="list"></div>

<!-- إعلان وسط -->
<div>
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-XXXXXXX"
       data-ad-slot="222222"
       data-ad-format="auto"></ins>
</div>

<button onclick="logout()">تسجيل الخروج</button>

</div>

</div>

<!-- من نحن -->
<div id="about" class="card hidden">
<h2>من نحن</h2>
<p>
موقع Followers Boost يساعد المستخدمين على زيادة المتابعين
من خلال تبادل التفاعل بطريقة بسيطة وآمنة.
</p>
</div>

<!-- سياسة الخصوصية -->
<div id="privacy" class="card hidden">
<h2>سياسة الخصوصية</h2>
<p>نحن نحترم خصوصيتك.</p>
<p>نستخدم Google AdSense لعرض الإعلانات.</p>
<p>نستخدم البريد الإلكتروني فقط لتسجيل الحساب.</p>
</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC0BzESCHSyXZhOxF8FXxEjxs_WYIPOEhA",
  authDomain: "followers-app-f3419.firebaseapp.com",
  projectId: "followers-app-f3419",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser=null;

// تنقل
function showPage(p){
  document.querySelectorAll(".card").forEach(el=>el.classList.add("hidden"));
  document.getElementById(p).classList.remove("hidden");
}

// تسجيل
function register(){
  auth.createUserWithEmailAndPassword(email.value,password.value)
  .then(u=>{
    currentUser=u.user;
    db.collection("users").doc(currentUser.uid).set({points:100});
  });
}

// دخول
function login(){
  auth.signInWithEmailAndPassword(email.value,password.value);
}

// مراقبة
auth.onAuthStateChanged(user=>{
  if(user){
    currentUser=user;
    auth.style.display="none";
    app.classList.remove("hidden");

    db.collection("users").doc(user.uid).get().then(doc=>{
      points.innerText=doc.data().points;
    });

    load();
  }
});

// إضافة رابط
function addLink(){
  db.collection("accounts").add({url:link.value});
  load();
}

// عرض الحسابات
function load(){
  db.collection("accounts").get().then(data=>{
    list.innerHTML="";
    data.forEach(doc=>{
      list.innerHTML+=`<div class="account">${doc.data().url}</div>`;
    });
  });
}

// خروج
function logout(){
  auth.signOut();
  location.reload();
}
</script>

<!-- تفعيل الإعلانات -->
<script async 
src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXX"
crossorigin="anonymous"></script>

<script>
(adsbygoogle = window.adsbygoogle || []).push({});
</script>

</body>
</html>

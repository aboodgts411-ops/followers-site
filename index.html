
<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>زيادة المتابعين</title>
</head>
<body style="background:#0f172a; color:white; font-family:Arial; text-align:center; padding:50px;">

  <h1>🚀 زيادة المتابعين</h1>

  <input id="link" type="text" placeholder="ضع رابط حسابك"
  style="padding:10px; width:250px; border-radius:8px; border:none;">
  
  <br><br>

  <button onclick="addLink()"
  style="padding:10px 20px; border:none; border-radius:8px; background:#38bdf8;">
  إرسال
  </button>

  <h2>👥 الحسابات</h2>
  <div id="list"></div>

<script>
let accounts = [];

function addLink() {
  let link = document.getElementById("link").value;
  if(link){
    accounts.push(link);
    show();
  }
}

function show() {
  let list = document.getElementById("list");
  list.innerHTML = "";
  accounts.forEach(acc => {
    list.innerHTML += `<p>${acc} <button onclick="follow()">تابع</button></p>`;
  });
}

function follow(){
  alert("تم! ستحصل على نقاط");
}
</script>

</body>
</html>

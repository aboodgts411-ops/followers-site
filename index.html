<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Followers Boost Pro</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

nav{
  background:#020617;
  padding:10px;
  text-align:center;
}

nav button{
  margin:5px;
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.container{
  max-width:420px;
  margin:auto;
  padding:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
}

.hidden{display:none;}

input, button{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
  border:none;
}

.account{
  background:#020617;
  padding:10px;
  border-radius:10px;
  margin:5px 0;
}
</style>
</head>

<body>

<nav>
<button onclick="showPage('home')">🏠 الرئيسية</button>
<button onclick="showPage('about')">ℹ️ من نحن</button>
<button onclick="showPage('privacy')">🔒 سياسة الخصوصية</button>
</nav>

<div class="container">

<!-- الرئيسية -->
<div id="home" class="card">

<h1>🚀 Followers Boost</h1>

<div id="auth">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="register()">تسجيل</button>
<button onclick="login()">دخول</button>
</div>

<div id="app" class="hidden">

<h3>⭐ النقاط: <span id="points">0</span></h3>

<input id="link" placeholder="رابط حسابك">
<button onclick="addLink()">إرسال</button>

<h3>👥 الحسابات</h3>
<div id="list"></div>

<button onclick="logout()">تسجيل الخروج</button>

</div>

</div>

<!-- من نحن -->
<div id="about" class="card hidden">
<h2>من نحن</h2>
<p>
موقع Followers Boost يساعد المستخدمين على زيادة المتابعين
من خلال تبادل التفاعل بطريقة بسيطة وآمنة.
</p>
</div>

<!-- سياسة الخصوصية -->
<div id="privacy" class="card hidden">
<h2>سياسة الخصوصية</h2>
<p>نحن نحترم خصوصيتك ونستخدم Google AdSense للإعلانات.</p>
</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC0BzESCHSyXZhOxF8FXxEjxs_WYIPOEhA",
  authDomain: "followers-app-f3419.firebaseapp.com",
  projectId: "followers-app-f3419",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

// تعريف العناصر
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const authDiv = document.getElementById("auth");
const appDiv = document.getElementById("app");
const pointsSpan = document.getElementById("points");
const linkInput = document.getElementById("link");
const listDiv = document.getElementById("list");

let currentUser = null;

// التنقل
function showPage(p){
  document.querySelectorAll(".card").forEach(el=>el.classList.add("hidden"));
  document.getElementById(p).classList.remove("hidden");
}

// تسجيل
function register(){
  auth.createUserWithEmailAndPassword(emailInput.value, passwordInput.value)
  .then(user=>{
    currentUser = user.user;
    db.collection("users").doc(currentUser.uid).set({points:100});
    alert("تم التسجيل بنجاح");
  })
  .catch(e=>alert(e.message));
}

// دخول
function login(){
  auth.signInWithEmailAndPassword(emailInput.value, passwordInput.value)
  .then(()=>alert("تم تسجيل الدخول"))
  .catch(e=>alert(e.message));
}

// مراقبة المستخدم
auth.onAuthStateChanged(user=>{
  if(user){
    currentUser = user;

    authDiv.style.display = "none";
    appDiv.classList.remove("hidden");

    db.collection("users").doc(user.uid).get().then(doc=>{
      pointsSpan.innerText = doc.data().points;
    });

    load();
  }
});

// إضافة رابط
function addLink(){
  db.collection("accounts").add({url: linkInput.value});
  load();
}

// عرض الحسابات
function load(){
  db.collection("accounts").get().then(data=>{
    listDiv.innerHTML = "";
    data.forEach(doc=>{
      listDiv.innerHTML += `<div class="account">${doc.data().url}</div>`;
    });
  });
}

// خروج
function logout(){
  auth.signOut();
  location.reload();
}
</script>

</body>
</html>

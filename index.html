<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Followers Boost</title>
</head>

<body style="margin:0; font-family:Arial; background:linear-gradient(135deg,#0f172a,#1e293b); color:white;">

<div style="display:flex; justify-content:center; align-items:center; height:100vh;">

<div style="background:#1e293b; padding:30px; border-radius:20px; width:350px; box-shadow:0 0 30px rgba(0,0,0,0.5); text-align:center;">

<h1>🚀 Followers Boost</h1>

<div id="auth">
<h3>تسجيل / دخول</h3>

<input id="username" placeholder="اسم المستخدم"
style="width:100%; padding:10px; margin:5px; border-radius:10px; border:none;">

<input id="password" type="password" placeholder="كلمة المرور"
style="width:100%; padding:10px; margin:5px; border-radius:10px; border:none;">

<button onclick="register()"
style="width:100%; padding:10px; margin-top:10px; border:none; border-radius:10px; background:#22c55e;">
تسجيل
</button>

<button onclick="login()"
style="width:100%; padding:10px; margin-top:10px; border:none; border-radius:10px; background:#3b82f6;">
دخول
</button>
</div>

<div id="app" style="display:none;">

<button onclick="logout()" style="background:red; color:white; padding:8px; border:none; border-radius:8px;">
تسجيل الخروج
</button>

<h3>النقاط: <span id="points">0</span></h3>

<button onclick="buyPoints()" 
style="background:gold; color:black; padding:10px; border:none; border-radius:10px;">
💰 شراء 100 نقطة
</button>

<input id="link" placeholder="رابط حسابك"
style="width:100%; padding:10px; margin:10px 0; border-radius:10px; border:none;">

<button onclick="addLink()"
style="width:100%; padding:10px; border:none; border-radius:10px; background:#38bdf8;">
إرسال
</button>

<h3>👥 الحسابات</h3>
<div id="list"></div>

</div>

</div>
</div>

<script>
let currentUser = null;

let savedUser = JSON.parse(localStorage.getItem("currentUser"));
if(savedUser){
  currentUser = savedUser;
  document.getElementById("auth").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("points").innerText = savedUser.points;
}

function register(){
  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;

  let users = JSON.parse(localStorage.getItem("users")) || [];
  users.push({user:user, pass:pass, points:100});

  localStorage.setItem("users", JSON.stringify(users));
  alert("تم التسجيل");
}

function login(){
  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;

  let users = JSON.parse(localStorage.getItem("users")) || [];
  let found = users.find(u => u.user === user && u.pass === pass);

  if(found){
    currentUser = found;
    localStorage.setItem("currentUser", JSON.stringify(currentUser));

    document.getElementById("auth").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("points").innerText = currentUser.points;
  } else {
    alert("خطأ");
  }
}

function buyPoints(){
  currentUser.points += 100;

  let users = JSON.parse(localStorage.getItem("users"));
  let index = users.findIndex(u => u.user === currentUser.user);
  users[index] = currentUser;

  localStorage.setItem("users", JSON.stringify(users));
  localStorage.setItem("currentUser", JSON.stringify(currentUser));

  document.getElementById("points").innerText = currentUser.points;

  alert("✅ تم إضافة 100 نقطة");
}

let accounts = JSON.parse(localStorage.getItem("accounts")) || [];

function addLink(){
  let link = document.getElementById("link").value;

  if(currentUser.points < 10){
    alert("❌ ليس لديك نقاط كافية");
    return;
  }

  currentUser.points -= 10;

  let users = JSON.parse(localStorage.getItem("users"));
  let index = users.findIndex(u => u.user === currentUser.user);
  users[index] = currentUser;

  localStorage.setItem("users", JSON.stringify(users));
  localStorage.setItem("currentUser", JSON.stringify(currentUser));

  document.getElementById("points").innerText = currentUser.points;

  accounts.push(link);
  localStorage.setItem("accounts", JSON.stringify(accounts));

  show();
}

function show(){
  let list = document.getElementById("list");
  list.innerHTML="";
  accounts.forEach(acc=>{
    list.innerHTML += `<p style="background:#0f172a; padding:10px; border-radius:10px;">
    ${acc} <button onclick="follow()">تابع</button></p>`;
  });
}

function follow(){
  currentUser.points += 10;

  let users = JSON.parse(localStorage.getItem("users"));
  let index = users.findIndex(u => u.user === currentUser.user);
  users[index] = currentUser;

  localStorage.setItem("users", JSON.stringify(users));
  localStorage.setItem("currentUser", JSON.stringify(currentUser));

  document.getElementById("points").innerText = currentUser.points;
}

function logout(){
  localStorage.removeItem("currentUser");
  location.reload();
}

show();
</script>

</body>
</html>

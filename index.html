<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Followers Boost</title>
</head>

<body style="margin:0; font-family:Arial; background:linear-gradient(135deg,#0f172a,#1e293b); color:white;">

<div style="display:flex; justify-content:center; align-items:center; height:100vh;">

<div style="background:#1e293b; padding:30px; border-radius:20px; width:350px; box-shadow:0 0 30px rgba(0,0,0,0.5); text-align:center;">

<h1>🚀 Followers Boost</h1>

<div id="auth">
<input id="username" placeholder="اسم المستخدم"><br><br>
<input id="password" type="password" placeholder="كلمة المرور"><br><br>

<button onclick="register()">تسجيل</button>
<button onclick="login()">دخول</button>
</div>

<div id="app" style="display:none;">

<button onclick="logout()" style="background:red; color:white;">تسجيل الخروج</button>

<h3>النقاط: <span id="points">0</span></h3>

<button onclick="buyPoints()">💰 شراء نقاط</button>

<input id="link" placeholder="رابط حسابك"><br><br>
<button onclick="addLink()">إرسال</button>

<div id="list"></div>

</div>

</div>
</div>

<script>
let currentUser = null;

function register(){
  let user = username.value;
  let pass = password.value;

  let users = JSON.parse(localStorage.getItem("users")) || [];
  users.push({user, pass, points:100});
  localStorage.setItem("users", JSON.stringify(users));
  alert("تم التسجيل");
}

function login(){
  let user = username.value;
  let pass = password.value;

  let users = JSON.parse(localStorage.getItem("users")) || [];
  let found = users.find(u => u.user === user && u.pass === pass);

  if(found){
    currentUser = found;
    document.getElementById("auth").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("points").innerText = currentUser.points;
  }
}

function buyPoints(){
  currentUser.points += 100;
  document.getElementById("points").innerText = currentUser.points;
}

let accounts = JSON.parse(localStorage.getItem("accounts")) || [];

function addLink(){
  let link = link.value;

  if(currentUser.points < 10){
    alert("لا توجد نقاط كافية");
    return;
  }

  currentUser.points -= 10;
  document.getElementById("points").innerText = currentUser.points;

  accounts.push(link);
  localStorage.setItem("accounts", JSON.stringify(accounts));
  show();
}

function show(){
  list.innerHTML="";
  accounts.forEach(acc=>{
    list.innerHTML += `<p>${acc} <button onclick="follow()">تابع</button></p>`;
  });
}

function follow(){
  currentUser.points += 10;
  document.getElementById("points").innerText = currentUser.points;
}

function logout(){
  location.reload();
}

show();
</script>

</body>
</html>

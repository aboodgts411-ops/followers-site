<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Followers Boost Pro</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#0f172a,#020617);
  color:white;
}

.container{
  max-width:420px;
  margin:auto;
  padding:20px;
}

.card{
  background:rgba(30,41,59,0.9);
  backdrop-filter:blur(10px);
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 40px rgba(0,0,0,0.7);
}

h1{
  text-align:center;
}

input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:12px;
  border:none;
  outline:none;
  font-size:14px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
}

.send{background:#38bdf8;}
.follow{background:#22c55e;}
.buy{background:linear-gradient(90deg,gold,orange); color:black;}
.logout{background:red;}

.account{
  background:#020617;
  padding:12px;
  border-radius:12px;
  margin:10px 0;
}

.leader{
  background:#111827;
  padding:10px;
  border-radius:10px;
  margin:5px;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>🚀 Followers Boost Pro</h1>

<div id="auth">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">تسجيل</button>
<button onclick="login()">دخول</button>
</div>

<div id="app" style="display:none;">

<h3>⭐ النقاط: <span id="points">0</span></h3>

<button class="buy" onclick="buyPoints()">💰 شراء نقاط</button>

<input id="link" placeholder="رابط حسابك">
<button class="send" onclick="addLink()">إرسال</button>

<h3>👥 الحسابات</h3>
<div id="list"></div>

<h3>🏆 المتصدرين</h3>
<div id="leaderboard"></div>

<button class="logout" onclick="logout()">تسجيل الخروج</button>

</div>

</div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC0BzESCHSyXZhOxF8FXxEjxs_WYIPOEhA",
  authDomain: "followers-app-f3419.firebaseapp.com",
  projectId: "followers-app-f3419",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;

function register(){
  auth.createUserWithEmailAndPassword(email.value,password.value)
  .then(user=>{
    currentUser = user.user;
    db.collection("users").doc(currentUser.uid).set({points:100});
  });
}

function login(){
  auth.signInWithEmailAndPassword(email.value,password.value);
}

auth.onAuthStateChanged(user=>{
  if(user){
    currentUser = user;
    authDiv.style.display="none";
    app.style.display="block";

    db.collection("users").doc(user.uid).get().then(doc=>{
      points.innerText = doc.data().points;
    });

    loadAccounts();
    loadLeaderboard();
  }
});

function buyPoints(){
  let ref = db.collection("users").doc(currentUser.uid);
  ref.get().then(doc=>{
    let p = doc.data().points + 100;
    ref.update({points:p});
    points.innerText = p;
  });
}

function addLink(){
  let ref = db.collection("users").doc(currentUser.uid);

  ref.get().then(doc=>{
    let p = doc.data().points;

    if(p < 10){ alert("❌ لا توجد نقاط"); return;}

    db.collection("accounts").add({url:link.value});
    ref.update({points:p-10});
    points.innerText = p-10;
  });
}

function loadAccounts(){
  db.collection("accounts").onSnapshot(data=>{
    list.innerHTML="";
    data.forEach(doc=>{
      let acc = doc.data().url;
      list.innerHTML += `
      <div class="account">
        ${acc}
        <button class="follow" onclick="follow('${acc}')">تابع</button>
      </div>`;
    });
  });
}

function follow(l){
  window.open(l,"_blank");

  let ref = db.collection("users").doc(currentUser.uid);
  ref.get().then(doc=>{
    let p = doc.data().points + 10;
    ref.update({points:p});
    points.innerText = p;
  });
}

function loadLeaderboard(){
  db.collection("users").orderBy("points","desc").limit(5)
  .onSnapshot(data=>{
    leaderboard.innerHTML="";
    data.forEach(doc=>{
      leaderboard.innerHTML += `
      <div class="leader">
        👤 ${doc.id} - ⭐ ${doc.data().points}
      </div>`;
    });
  });
}

function logout(){
  auth.signOut();
  location.reload();
}
</script>

</body>
</html>

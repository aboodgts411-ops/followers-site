<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>منصة المتابعين</title>
</head>

<body style="background:#0f172a; color:white; text-align:center; font-family:Arial; padding:50px;">

<h1>🚀 منصة زيادة المتابعين</h1>

<div id="auth">

<h2>تسجيل</h2>
<input id="username" placeholder="اسم المستخدم"><br><br>
<input id="password" type="password" placeholder="كلمة المرور"><br><br>

<button onclick="register()">تسجيل</button>
<button onclick="login()">دخول</button>

</div>

<div id="app" style="display:none;">

<h2>أضف حسابك</h2>
<input id="link" placeholder="رابط حسابك"><br><br>
<button onclick="addLink()">إرسال</button>

<h3>النقاط: <span id="points">0</span></h3>

<h2>الحسابات</h2>
<div id="list"></div>

</div>

<script>
let currentUser = null;

function register(){
  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;

  let users = JSON.parse(localStorage.getItem("users")) || [];

  users.push({user, pass, points:0});
  localStorage.setItem("users", JSON.stringify(users));

  alert("تم التسجيل");
}

function login(){
  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;

  let users = JSON.parse(localStorage.getItem("users")) || [];

  let found = users.find(u => u.user === user && u.pass === pass);

  if(found){
    currentUser = found;
    document.getElementById("auth").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("points").innerText = found.points;
  } else {
    alert("خطأ");
  }
}

let accounts = JSON.parse(localStorage.getItem("accounts")) || [];

function addLink(){
  let link = document.getElementById("link").value;

  if(currentUser.points < 10){
    alert("❌ ليس لديك نقاط كافية");
    return;
  }

  currentUser.points -= 10;

  let users = JSON.parse(localStorage.getItem("users"));
  let index = users.findIndex(u => u.user === currentUser.user);
  users[index] = currentUser;
  localStorage.setItem("users", JSON.stringify(users));

  document.getElementById("points").innerText = currentUser.points;

  accounts.push(link);
  localStorage.setItem("accounts", JSON.stringify(accounts));

  show();
}

function show(){
  let list = document.getElementById("list");
  list.innerHTML="";
  accounts.forEach(acc=>{
    list.innerHTML += `<p>${acc} <button onclick="follow()">تابع</button></p>`;
  });
}

function follow(){
  currentUser.points += 10;
  document.getElementById("points").innerText = currentUser.points;
}
show();
</script>

</body>
</html>

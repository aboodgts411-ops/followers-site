<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Followers Boost Pro</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.container{
  max-width:420px;
  margin:auto;
  padding:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:20px;
  box-shadow:0 0 20px rgba(0,0,0,0.4);
}

h1{
  text-align:center;
  background:linear-gradient(90deg,#38bdf8,#22c55e);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hidden{display:none;}

input, textarea{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:12px;
  border:none;
  background:#020617;
  color:white;
}

button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:12px;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

.btn-main{background:#22c55e;}
.btn-buy{background:#f59e0b;}
.btn-follow{background:#38bdf8;}

.account{
  background:#020617;
  padding:12px;
  border-radius:12px;
  margin:6px 0;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>🚀 Followers Boost</h1>

<div id="auth">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button class="btn-main" onclick="register()">تسجيل</button>
<button class="btn-main" onclick="login()">دخول</button>
</div>

<div id="app" class="hidden">

<h3>⭐ النقاط: <span id="points">0</span></h3>

<button class="btn-buy" onclick="buyPoints()">💳 شراء 100 نقطة</button>

<textarea id="message" placeholder="اكتب: دفعت 1$"></textarea>
<button class="btn-main" onclick="sendRequest()">📩 إرسال الطلب</button>

<input id="link" placeholder="رابط حسابك">
<button class="btn-main" onclick="addLink()">➕ إضافة حساب</button>

<h3>👥 الحسابات</h3>
<div id="list"></div>

<h3>🏆 الأفضل</h3>
<div id="leaderboard"></div>

<button onclick="logout()">🚪 خروج</button>

</div>

<div id="adminPanel" class="hidden">
<h2>🔐 لوحة التحكم</h2>

<div id="requests"></div>

<input id="adminUid" placeholder="User ID">
<input id="adminPoints" placeholder="Points">
<button class="btn-main" onclick="addPoints()">➕ إضافة نقاط</button>

</div>

</div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC0BzESCHSyXZhOxF8FXxEjxs_WYIPOEhA",
  authDomain: "followers-app-f3419.firebaseapp.com",
  projectId: "followers-app-f3419",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const ADMIN_EMAIL = "abood.gts.411@gmail.com";

let currentUser=null;

auth.onAuthStateChanged(user=>{
  if(user){
    currentUser=user;

    auth.style.display="none";
    app.classList.remove("hidden");

    db.collection("users").doc(user.uid).get().then(doc=>{
      points.innerText=doc.data().points;
    });

    loadAccounts();
    loadLeaderboard();

    if(user.email===ADMIN_EMAIL){
      adminPanel.classList.remove("hidden");
      loadRequests();
    }
  }
});

function register(){
  auth.createUserWithEmailAndPassword(email.value,password.value)
  .then(u=>{
    db.collection("users").doc(u.user.uid).set({points:100});
  });
}

function login(){
  auth.signInWithEmailAndPassword(email.value,password.value);
}

function buyPoints(){
  window.open("https://paypal.me/Lakrad989/1","_blank");
}

function sendRequest(){
  db.collection("requests").add({
    uid:currentUser.uid,
    email:currentUser.email,
    message:message.value
  });
  alert("تم الإرسال");
}

function loadRequests(){
  db.collection("requests").onSnapshot(data=>{
    requests.innerHTML="";
    data.forEach(doc=>{
      let r=doc.data();
      requests.innerHTML+=`
      <div class="account">
        📧 ${r.email}<br>
        🆔 ${r.uid}<br>
        💬 ${r.message}
      </div>`;
    });
  });
}

function addPoints(){
  let uid=adminUid.value;
  let pts=parseInt(adminPoints.value);

  let ref=db.collection("users").doc(uid);

  ref.get().then(doc=>{
    let p=doc.data().points+pts;
    ref.update({points:p});
    alert("تمت الإضافة");
  });
}

function addLink(){
  db.collection("accounts").add({url:link.value});
  loadAccounts();
}

function loadAccounts(){
  db.collection("accounts").get().then(data=>{
    list.innerHTML="";
    data.forEach(doc=>{
      let url=doc.data().url;

      list.innerHTML+=`
      <div class="account">
        ${url}
        <button class="btn-follow" onclick="follow('${url}',this)">تابع</button>
      </div>`;
    });
  });
}

// 🔥 حماية من الغش
function follow(url,btn){

  let userId = currentUser.uid;
  let accountId = btoa(url);

  let ref = db.collection("follows").doc(userId + "_" + accountId);

  ref.get().then(doc=>{

    if(doc.exists){
      alert("لقد استخدمت هذا الحساب من قبل ❌");
      return;
    }

    btn.disabled=true;
    btn.innerText="⏳ انتظر";

    window.open(url,"_blank");

    let t=10;

    let timer=setInterval(()=>{
      t--;
      btn.innerText="⏳ "+t;

      if(t<=0){
        clearInterval(timer);

        ref.set({done:true});

        let userRef=db.collection("users").doc(userId);

        userRef.get().then(d=>{
          let p=d.data().points+8;
          userRef.update({points:p});
          points.innerText=p;
        });

        btn.innerText="✔";
      }
    },1000);

  });
}

function loadLeaderboard(){
  db.collection("users").orderBy("points","desc").limit(5)
  .onSnapshot(data=>{
    leaderboard.innerHTML="";
    data.forEach(doc=>{
      leaderboard.innerHTML+=`
      <div class="account">
        ⭐ ${doc.data().points}
      </div>`;
    });
  });
}

function logout(){
  auth.signOut();
  location.reload();
}
</script>

</body>
</html>

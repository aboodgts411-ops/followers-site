<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Followers Boost Pro</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}
.container{max-width:420px;margin:auto;padding:20px;}
.card{background:#1e293b;padding:20px;border-radius:20px;}
h1{text-align:center;color:#38bdf8;}
.hidden{display:none;}
input,textarea{width:100%;padding:12px;margin:6px 0;border-radius:12px;border:none;background:#020617;color:white;}
button{width:100%;padding:12px;margin:6px 0;border-radius:12px;border:none;font-weight:bold;cursor:pointer;}
.btn-main{background:#22c55e;}
.btn-buy{background:#f59e0b;}
.btn-vip{background:#a855f7;}
.account{background:#020617;padding:12px;border-radius:12px;margin:6px 0;}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>🚀 Followers Boost</h1>

<div id="auth">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button class="btn-main" onclick="register()">تسجيل</button>
<button class="btn-main" onclick="login()">دخول</button>
</div>

<div id="app" class="hidden">

<h3>⭐ النقاط: <span id="points">0</span></h3>
<h3>👑 الحالة: <span id="vipStatus">عادي</span></h3>

<button class="btn-buy" onclick="buyPoints()">💳 شراء نقاط</button>
<button class="btn-vip" onclick="buyVIP()">🔥 شراء VIP</button>

<button class="btn-main" onclick="dailyReward()">🎁 مكافأة يومية</button>

<textarea id="message" placeholder="دفعت"></textarea>
<button onclick="sendRequest()">📩 إرسال الطلب</button>

<input id="link" placeholder="رابط المهمة">
<button onclick="addTask()">➕ إضافة مهمة</button>

<div id="list"></div>

<button onclick="logout()">خروج</button>

</div>

<div id="adminPanel" class="hidden">
<h2>🔐 Admin</h2>
<div id="requests"></div>
<input id="adminUid" placeholder="UID">
<input id="adminPoints" placeholder="Points">
<button onclick="addPoints()">إضافة</button>
<button onclick="giveVIP()">👑 إعطاء VIP</button>
</div>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig={
 apiKey:"AIzaSy...",
 authDomain:"followers-app-f3419.firebaseapp.com",
 projectId:"followers-app-f3419"
};
firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();

const ADMIN_EMAIL="abood.gts.411@gmail.com";

let currentUser=null;

auth.onAuthStateChanged(user=>{
 if(user){
  currentUser=user;

  authDiv.style.display="none";
  app.classList.remove("hidden");

  let ref=db.collection("users").doc(user.uid);

  ref.get().then(doc=>{
    let d=doc.data();
    points.innerText=d.points;
    vipStatus.innerText=d.vip?"VIP 👑":"عادي";
  });

  loadTasks();

  if(user.email===ADMIN_EMAIL){
    adminPanel.classList.remove("hidden");
    loadRequests();
  }
 }
});

function register(){
 auth.createUserWithEmailAndPassword(email.value,password.value)
 .then(u=>{
  db.collection("users").doc(u.user.uid).set({
    points:100,
    vip:false,
    lastDaily:0
  });
 });
}

function login(){
 auth.signInWithEmailAndPassword(email.value,password.value);
}

function buyPoints(){
 window.open("https://paypal.me/Lakrad989/1");
}

function buyVIP(){
 window.open("https://paypal.me/Lakrad989/5");
}

function sendRequest(){
 db.collection("requests").add({
  uid:currentUser.uid,
  email:currentUser.email,
  message:message.value
 });
 alert("تم");
}

function loadRequests(){
 db.collection("requests").onSnapshot(s=>{
  requests.innerHTML="";
  s.forEach(d=>{
    let r=d.data();
    requests.innerHTML+=`<div class="account">${r.email}<br>${r.uid}</div>`;
  });
 });
}

function addPoints(){
 let uid=adminUid.value;
 let pts=parseInt(adminPoints.value);

 let ref=db.collection("users").doc(uid);

 ref.get().then(d=>{
  ref.update({points:d.data().points+pts});
 });
}

function giveVIP(){
 let uid=adminUid.value;
 db.collection("users").doc(uid).update({vip:true});
}

function addTask(){
 db.collection("tasks").add({url:link.value});
 loadTasks();
}

function loadTasks(){
 db.collection("tasks").get().then(s=>{
  list.innerHTML="";
  s.forEach(d=>{
    let url=d.data().url;

    list.innerHTML+=`
    <div class="account">
    ${url}
    <button onclick="doTask('${url}',this)">تنفيذ</button>
    </div>`;
  });
 });
}

function doTask(url,btn){
 let id=currentUser.uid+"_"+btoa(url);

 let ref=db.collection("done").doc(id);

 ref.get().then(doc=>{
  if(doc.exists){alert("منفذ ❌");return;}

  btn.disabled=true;
  window.open(url);

  setTimeout(()=>{
    ref.set({done:true});

    let userRef=db.collection("users").doc(currentUser.uid);

    userRef.get().then(d=>{
      let reward=10;
      if(d.data().vip) reward=20;

      userRef.update({points:d.data().points+reward});
      points.innerText=d.data().points+reward;
    });

    btn.innerText="✔";
  },10000);
 });
}

// 🎁 مكافأة يومية
function dailyReward(){
 let ref=db.collection("users").doc(currentUser.uid);

 ref.get().then(d=>{
  let now=Date.now();

  if(now - d.data().lastDaily < 86400000){
    alert("ارجع غدا ❌");
    return;
  }

  let reward=50;
  if(d.data().vip) reward=100;

  ref.update({
    points:d.data().points+reward,
    lastDaily:now
  });

  points.innerText=d.data().points+reward;
 });
}

function logout(){
 auth.signOut();
 location.reload();
}
</script>

</body>
  </html>

<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Followers Boost Pro</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;}
.container{max-width:420px;margin:auto;padding:20px;}
.card{background:#1e293b;padding:20px;border-radius:20px;}
input,textarea,button{width:100%;padding:10px;margin:5px 0;border-radius:10px;border:none;}
button{cursor:pointer;font-weight:bold;}
.account{background:#020617;padding:10px;border-radius:10px;margin:5px 0;}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h2>🚀 Followers Boost</h2>

<div id="auth">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="register()">تسجيل</button>
<button onclick="login()">دخول</button>
</div>

<div id="app" class="hidden">

<p>⭐ نقاطك: <span id="points">0</span></p>

<button onclick="copyUID()">📋 نسخ UID</button>

<textarea id="message" placeholder="دفعت"></textarea>
<button onclick="sendRequest()">📩 إرسال الطلب</button>

<input id="link" placeholder="رابط المهمة">
<button onclick="addTask()">➕ إضافة مهمة</button>

<div id="list"></div>

<button onclick="logout()">خروج</button>

</div>

<div id="adminPanel" class="hidden">
<h3>🔐 Admin</h3>
<div id="requests"></div>
</div>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig={
 apiKey:"AIzaSy...",
 authDomain:"followers-app-f3419.firebaseapp.com",
 projectId:"followers-app-f3419"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();

const ADMIN_EMAIL="abood.gts.411@gmail.com";

let currentUser=null;

auth.onAuthStateChanged(user=>{
 if(user){
  currentUser=user;

  auth.style.display="none";
  app.classList.remove("hidden");

  db.collection("users").doc(user.uid).get().then(doc=>{
    points.innerText=doc.data().points;
  });

  loadTasks();

  if(user.email===ADMIN_EMAIL){
    adminPanel.classList.remove("hidden");
    loadRequests();
  }
 }
});

function register(){
 auth.createUserWithEmailAndPassword(email.value,password.value)
 .then(u=>{
  db.collection("users").doc(u.user.uid).set({points:100});
 });
}

function login(){
 auth.signInWithEmailAndPassword(email.value,password.value);
}

// 📋 نسخ UID
function copyUID(){
 navigator.clipboard.writeText(currentUser.uid);
 alert("تم نسخ UID");
}

// 📩 إرسال طلب
function sendRequest(){
 db.collection("requests").add({
  uid:currentUser.uid,
  email:currentUser.email,
  message:message.value
 });
 alert("تم");
}

// 🔥 منع السبام (5 مهام فقط)
function addTask(){
 db.collection("tasks").where("owner","==",currentUser.uid).get().then(s=>{

  if(s.size>=5){
    alert("وصلت الحد الأقصى ❌");
    return;
  }

  db.collection("tasks").add({
    url:link.value,
    owner:currentUser.uid
  });

  loadTasks();
 });
}

// تحميل المهام
function loadTasks(){
 db.collection("tasks").get().then(s=>{
  list.innerHTML="";
  s.forEach(d=>{
    let url=d.data().url;

    list.innerHTML+=`
    <div class="account">
    ${url}
    <button onclick="doTask('${url}',this)">تنفيذ</button>
    </div>`;
  });
 });
}

// تنفيذ
function doTask(url,btn){
 let id=currentUser.uid+"_"+btoa(url);

 let ref=db.collection("done").doc(id);

 ref.get().then(doc=>{
  if(doc.exists){alert("تم ❌");return;}

  btn.disabled=true;
  window.open(url);

  setTimeout(()=>{
    ref.set({done:true});

    let userRef=db.collection("users").doc(currentUser.uid);

    userRef.get().then(d=>{
      let p=d.data().points+10;
      userRef.update({points:p});
      points.innerText=p;
    });

    btn.innerText="✔";
  },10000);
 });
}

// 🔐 Admin
function loadRequests(){
 db.collection("requests").onSnapshot(s=>{
  requests.innerHTML="";
  s.forEach(d=>{
    let r=d.data();

    requests.innerHTML+=`
    <div class="account">
    ${r.email}<br>${r.uid}<br>${r.message}
    <button onclick="deleteReq('${d.id}')">حذف</button>
    </div>`;
  });
 });
}

function deleteReq(id){
 db.collection("requests").doc(id).delete();
}

function logout(){
 auth.signOut();
 location.reload();
}
</script>

</body>
</html>
